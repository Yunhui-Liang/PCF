[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcf-vlm-fusion"
version = "1.0.1"
description = "Progressive Candidate Fusion of frozen vision-language model predictions"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "scikit-learn==1.7.2", "lightgbm==4.6.0", "torch==2.7.1"]

[tool.setuptools.packages.find]
include = ["pcf*"]
